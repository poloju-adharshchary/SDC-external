
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center">Shopping Cart</h2>

    <table class="table table-bordered text-center mt-4">
        <tr class="table-dark">
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Remove</th>
        </tr>
        <tbody id="cartItems"></tbody>
    </table>

    <h4 class="text-end">Grand Total: ₹<span id="total">0</span></h4>

    <a href="catalog.html" class="btn btn-primary">Continue Shopping</a>
    <button class="btn btn-success" onclick="order()">Place Order</button>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function display() {
    let data = "", sum = 0;

    cart.forEach((p, i) => {
        let price = p.price * p.qty;
        sum += price;

        data += `<tr>
            <td>${p.name}</td>
            <td>₹${p.price}</td>
            <td>
                <button onclick="change(${i},-1)">-</button>
                ${p.qty}
                <button onclick="change(${i},1)">+</button>
            </td>
            <td>₹${price}</td>
            <td><button class="btn btn-danger btn-sm" onclick="remove(${i})">Remove</button></td>
        </tr>`;
    });

    document.getElementById("cartItems").innerHTML =
        data || '<tr><td colspan="5">Cart is Empty</td></tr>';

    document.getElementById("total").innerHTML = sum;
}

function change(i, n) {
    cart[i].qty += n;
    if (cart[i].qty <= 0) cart.splice(i, 1);
    save();
}

function remove(i) {
    cart.splice(i, 1);
    save();
}

function save() {
    localStorage.setItem("cart", JSON.stringify(cart));
    display();
}

function order() {
    if (cart.length == 0) {
        alert("Cart is Empty!");
        return;
    }

    alert("Order Placed Successfully!");
    cart = [];
    localStorage.removeItem("cart");
    display();
}

display();
</script>

</body>
</html>
