
<!DOCTYPE html>
<html>
<head>
    <title>Weather Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center">Weather Information</h2>

    <div class="input-group mt-4">
        <input type="text" id="city" class="form-control" placeholder="Enter City Name">
        <button class="btn btn-primary" onclick="getWeather()">Get Weather</button>
    </div>

    <h4 id="info" class="text-center mt-4"></h4>

    <div class="mt-4">
        <canvas id="weatherChart"></canvas>
    </div>
</div>
`
<script>
let chart;

async function getWeather() {
    let city = document.getElementById("city").value;
    let key = "aac484d8bd95cd4460a508b346647404";

    if (city == "") {
        alert("Please Enter City Name");
        return;
    }

    let url = `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${key}&units=metric`;

    try {
        let response = await fetch(url);
        let data = await response.json();

        if (data.cod != "200") {
            alert("City Not Found or Invalid API Key");
            return;
        }

        document.getElementById("info").innerHTML =
            data.city.name + " - " + data.list[0].weather[0].description;

        let labels = data.list.slice(0, 8).map(x => x.dt_txt);
        let temps = data.list.slice(0, 8).map(x => x.main.temp);

        if (chart) {
            chart.destroy();
        }

        chart = new Chart(document.getElementById("weatherChart"), {
            type: "line",
            data: {
                labels: labels,
                datasets: [{
                    label: "Temperature (°C)",
                    data: temps,
                    borderColor: "blue",
                    fill: false
                }]
            },
            options: {
                responsive: true
            }
        });

    } catch (error) {
        alert("Unable to get weather information");
    }
}
</script>

</body>
</html>
