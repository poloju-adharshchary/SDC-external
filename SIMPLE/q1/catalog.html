
<!DOCTYPE html>
<html>
<head>
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark p-3">
    <a class="navbar-brand">Shopping Cart</a>
    <a href="cart.html" class="btn btn-warning">View Cart</a>
</nav>

<div class="container mt-4">
    <h2 class="text-center">Product Catalog</h2>

    <div class="row text-center mt-4">

        <div class="col-md-4">
            <div class="card p-3">
                <h4>Mobile</h4>
                <p>₹15000</p>
                <button class="btn btn-primary" onclick="addCart('Mobile',15000)">Add to Cart</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3">
                <h4>Laptop</h4>
                <p>₹45000</p>
                <button class="btn btn-primary" onclick="addCart('Laptop',45000)">Add to Cart</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3">
                <h4>Headphones</h4>
                <p>₹2000</p>
                <button class="btn btn-primary" onclick="addCart('Headphones',2000)">Add to Cart</button>
            </div>
        </div>

    </div>
</div>

<script>
function addCart(name, price) {
    let cart=JSON.parse(localStorage.getItem("cart")) || [];
    let item=cart.find(p => p.name === name);
    if(item){
        item.qty++;
    } else{
        cart.push({name,price,qty:1})
    }
    localStorage.setItem("cart",JSON.stringify(cart))
    alert('Product Added to Cart');
}
</script>

</body>
</html>
