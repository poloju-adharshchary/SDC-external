<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card mx-auto p-4" style="max-width:400px;">
        <h3 class="text-center">Registration</h3>

        <form>
            <input type="text" class="form-control mb-3" placeholder="Enter Name" required>
            <input type="email" class="form-control mb-3" placeholder="Enter Email" required>
            <input type="password" class="form-control mb-3" placeholder="Enter Password" required>

            <button class="btn btn-primary w-100">Register</button>
        </form>

        <p class="text-center mt-3">
            Already registered? <a href="login.html">Login</a>
        </p>
    </div>
</div>

</body>
</html>
