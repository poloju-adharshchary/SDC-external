
<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card mx-auto p-4" style="max-width:400px;">
        <h3 class="text-center">Registration</h3>

        <form action="UserController" method="post" onsubmit="return validate()">

            <input type="hidden" name="action" value="register">

            <input type="text" id="name" name="name" class="form-control mb-3" placeholder="Enter Name">

            <input type="text" id="email" name="email" class="form-control mb-3" placeholder="Enter Email">

            <input type="password" id="password" name="password" class="form-control mb-3" placeholder="Enter Password">

            <input type="password" id="confirm" class="form-control mb-3" placeholder="Confirm Password">

            <button class="btn btn-primary w-100">Register</button>
        </form>

        <p class="text-center mt-3">
            Already registered? <a href="login.html">Login</a>
        </p>
    </div>
</div>

<script>
function validate() {
    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let confirm = document.getElementById("confirm").value;

    let pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (name == "") {
        alert("Please Enter Name");
        return false;
    }

    if (!pattern.test(email)) {
        alert("Please Enter Valid Email");
        return false;
    }

    if (password.length < 6) {
        alert("Password Must Be At Least 6 Characters");
        return false;
    }

    if (password != confirm) {
        alert("Passwords Do Not Match");
        return false;
    }

    alert("Registration Successful!");
    return true;
}
</script>

</body>
</html>
